targets:
  $default:
    builders:
      drift_dev:
        options:
          # Simpan tanggal sebagai ISO-8601 (dengan zona waktu) agar siap
          # disinkronkan ke cloud di kemudian hari (lihat ADR-0001).
          store_date_time_values_as_text: true
          # Dipakai `dart run drift_dev make-migrations` untuk menyimpan
          # snapshot setiap versi skema dan membuat tes migrasi.
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
